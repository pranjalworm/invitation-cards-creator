<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Spring Party Invitation</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          #fdf6e3 0%,
          #e8f5e9 50%,
          #fff8e1 100%
        );
        font-family: 'Lora', Georgia, serif;
        padding: 2rem;
      }

      .card {
        position: relative;
        width: 100%;
        max-width: 560px;
        background: #fffef9;
        border-radius: 16px;
        padding: 3rem 2.5rem;
        box-shadow:
          0 4px 24px rgba(0, 0, 0, 0.06),
          0 1px 4px rgba(0, 0, 0, 0.04);
        border: 1px solid #e8e4d9;
        text-align: center;
        overflow: hidden;
      }

      .card::before,
      .card::after {
        content: '';
        position: absolute;
        width: 120px;
        height: 120px;
        background-repeat: no-repeat;
        background-size: contain;
        opacity: 0.12;
        pointer-events: none;
      }

      .card::before {
        top: -10px;
        left: -10px;
        background: radial-gradient(
          circle at 30% 30%,
          #81c784,
          transparent 70%
        );
        width: 160px;
        height: 160px;
        border-radius: 50%;
      }

      .card::after {
        bottom: -10px;
        right: -10px;
        background: radial-gradient(
          circle at 70% 70%,
          #ffb74d,
          transparent 70%
        );
        width: 160px;
        height: 160px;
        border-radius: 50%;
      }

      .flourish {
        color: #81c784;
        font-size: 1.6rem;
        letter-spacing: 0.3rem;
        margin-bottom: 0.5rem;
      }

      .card-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 2.4rem;
        font-weight: 700;
        color: #2e7d32;
        margin-bottom: 0.25rem;
        line-height: 1.2;
      }

      .card-subtitle {
        font-size: 0.95rem;
        color: #8d6e63;
        text-transform: uppercase;
        letter-spacing: 0.2rem;
        margin-bottom: 2rem;
      }

      .divider {
        width: 60px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #c5e1a5, transparent);
        margin: 0 auto 2rem;
      }

      .greeting {
        font-size: 1.1rem;
        color: #5d4037;
        margin-bottom: 0.25rem;
      }

      .guest-names {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: #3e2723;
        margin-bottom: 1.5rem;
      }

      .message {
        font-size: 1.05rem;
        color: #5d4037;
        line-height: 1.8;
        margin-bottom: 2rem;
      }

      .details {
        display: flex;
        justify-content: center;
        gap: 2.5rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      .detail-item {
        text-align: center;
      }

      .detail-label {
        display: block;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.15rem;
        color: #a1887f;
        margin-bottom: 0.3rem;
      }

      .detail-value {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 1.1rem;
        font-weight: 700;
        color: #2e7d32;
      }

      .divider-bottom {
        width: 60px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #c5e1a5, transparent);
        margin: 0 auto 1.5rem;
      }

      .hosted-by {
        font-size: 0.85rem;
        color: #8d6e63;
        text-transform: uppercase;
        letter-spacing: 0.15rem;
        margin-bottom: 0.25rem;
      }

      .hosts {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-size: 1.3rem;
        color: #3e2723;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="flourish">&#10048; &#10048; &#10048;</div>
      <h1 class="card-title">Spring Party!</h1>
      <p class="card-subtitle">You're Invited</p>

      <div class="divider"></div>

      <p class="greeting">Dear</p>
      <p class="guest-names">{{guestName}}</p>

      <p class="message">
        Please join us for an evening of food, drinks, and good company as we
        celebrate the arrival of spring!
      </p>

      <div class="details">
        <div class="detail-item">
          <span class="detail-label">Date</span>
          <span class="detail-value">March 1, 2026</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Time</span>
          <span class="detail-value">6:00 PM</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Venue</span>
          <span class="detail-value">Our Home</span>
        </div>
      </div>

      <div class="divider-bottom"></div>

      <p class="hosted-by">Yours truly</p>
      <p class="hosts">Aishwarya &amp; Pranjal</p>
    </div>
  </body>
</html>
