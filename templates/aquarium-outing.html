<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aquarium Adventure Invitation</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Nunito:wght@400;600;700&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e0f7fa;
        font-family: 'Nunito', sans-serif;
        padding: 2rem;
      }

      .card {
        position: relative;
        width: 704px;
        aspect-ratio: 1408 / 768;
        background-image: url('assets/backgrounds/whales.png');
        background-size: cover;
        background-position: center;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 5rem 8rem;
        overflow: hidden;
      }

      .content-box {
        background: rgba(255, 255, 255, 0.75);
        border-radius: 12px;
        padding: 1.5rem 2.5rem;
        backdrop-filter: blur(2px);
      }

      .card-title {
        font-family: 'Bubblegum Sans', cursive;
        font-size: 2.2rem;
        color: #1565c0;
        line-height: 1.1;
        margin-bottom: 0.15rem;
      }

      .card-subtitle {
        font-size: 0.8rem;
        font-weight: 700;
        color: #00695c;
        text-transform: uppercase;
        letter-spacing: 0.2rem;
        margin-bottom: 0.7rem;
      }

      .greeting {
        font-size: 0.95rem;
        color: #37474f;
      }

      .guest-name {
        font-family: 'Bubblegum Sans', cursive;
        font-size: 1.5rem;
        color: #1565c0;
        margin-bottom: 0.5rem;
      }

      .message {
        font-size: 0.8rem;
        color: #37474f;
        line-height: 1.6;
        margin-bottom: 0.7rem;
        max-width: 380px;
      }

      .details {
        display: flex;
        justify-content: center;
        gap: 1.8rem;
        margin-bottom: 0.7rem;
        flex-wrap: wrap;
      }

      .detail-item {
        text-align: center;
      }

      .detail-label {
        display: block;
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.12rem;
        color: #78909c;
        margin-bottom: 0.15rem;
      }

      .detail-value {
        font-family: 'Bubblegum Sans', cursive;
        font-size: 0.9rem;
        color: #00695c;
      }

      .hosted-by {
        font-size: 0.7rem;
        color: #78909c;
        text-transform: uppercase;
        letter-spacing: 0.12rem;
        margin-bottom: 0.1rem;
      }

      .hosts {
        font-family: 'Bubblegum Sans', cursive;
        font-size: 1.05rem;
        color: #37474f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="content-box">
        <h1 class="card-title">Aquarium Adventure!</h1>
        <p class="card-subtitle">You're Invited</p>

        <p class="greeting">Dear</p>
        <p class="guest-name">{{guestName}}</p>

        <p class="message">
{{message}}
        </p>

        <div class="details">
          <div class="detail-item">
            <span class="detail-label">Date</span>
            <span class="detail-value">{{eventDate}}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Time</span>
            <span class="detail-value">{{time}}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Venue</span>
            <span class="detail-value">{{venue}}</span>
          </div>
        </div>

        <p class="hosted-by">Hosted by</p>
        <p class="hosts">{{hostName}}</p>
      </div>
    </div>
  </body>
</html>
